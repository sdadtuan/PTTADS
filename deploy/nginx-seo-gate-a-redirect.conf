# SEO Gate A — legacy Flask bookmarks → ops-web /seo/* (Phase 7 §7.7)
# Include inside rs.pttads.vn server { } before ops-web catch-all.
#
# Examples:
#   /crm/seo           → /seo/hub
#   /crm/seo/research  → /seo/research
#   /crm/aeo           → /seo/aeo

location = /crm/seo {
    return 301 /seo/hub;
}

location ^~ /crm/seo/ {
    rewrite ^/crm/seo(/.*)$ /seo$1 break;
    proxy_pass http://ptt_ops_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /crm/aeo {
    return 301 /seo/aeo;
}
